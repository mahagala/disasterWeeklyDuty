name: Update disaster data and publish
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: disaster-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      degraded: ${{ steps.feeds.outputs.degraded }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate application and collector
        run: |
          node --check app.js
          node --test tests/loader.test.cjs
          python -m unittest discover -s tests -v
      - name: Download and validate feeds
        id: feeds
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: python scripts/update_feeds.py
      - name: Save last successful data for future runs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'chore(data): refresh disaster feeds'
            git push origin HEAD:main
          fi
      - name: Prepare public website
        run: |
          mkdir -p _site
          cp index.html app.js styles.css *.png *.svg *.jpg _site/
          cp -R data _site/data
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report upstream failures after publishing available data
        if: needs.build.outputs.degraded == 'true'
        run: |
          echo 'One or more feeds failed. Available data was published; inspect the build summary.'
          exit 1
